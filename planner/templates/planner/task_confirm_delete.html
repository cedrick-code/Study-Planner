{% extends 'base.html' %}
{% block title %}Delete task | Study Planner{% endblock %}

{% block content %}
<div class="card form-card">
  <h1 style="color: var(--red);">Delete task?</h1>
  <p class="intro">
    You are about to delete <strong>{{ task.title }}</strong>. This cannot be undone.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a href="{% url 'dashboard' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
