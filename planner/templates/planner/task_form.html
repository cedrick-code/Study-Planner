{% extends 'base.html' %}
{% block title %}{{ heading }} | Study Planner{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 14px; border: 1px solid rgb(36 88 198 / 18%);">
  <h1>{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding: 10px 18px; border: 0; border-radius: 8px; background: #2458c6; color: #fff; font-weight: 700; cursor: pointer;">Save</button>
    <a href="{% url 'dashboard' %}" style="margin-left: 12px;">Cancel</a>
  </form>
</div>
{% endblock %}
