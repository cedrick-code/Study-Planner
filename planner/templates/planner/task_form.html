{% extends 'base.html' %}
{% block title %}{{ heading }} | Study Planner{% endblock %}

{% block content %}
<div class="card form-card">
  <h1>{{ heading }}</h1>
  <p class="intro">Fill in the details of your study task.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button class="btn" type="submit">Save task</button>
      <a href="{% url 'dashboard' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
