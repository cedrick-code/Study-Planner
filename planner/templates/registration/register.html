{% extends 'base.html' %}
{% block title %}Register | Study Planner{% endblock %}

{% block content %}
<div class="card form-card" style="margin-top: 40px;">
  <h1>Create account</h1>
  <p class="intro">Start organizing your study tasks.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-block" type="submit">Register</button>
  </form>

  <p class="auth-footer">
    Already have an account? <a href="{% url 'login' %}">Log in</a>
  </p>
</div>
{% endblock %}
