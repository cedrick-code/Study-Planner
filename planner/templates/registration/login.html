{% extends 'base.html' %}
{% block title %}Log in | Study Planner{% endblock %}

{% block content %}
<div class="card form-card" style="margin-top: 40px;">
  <h1>Welcome back</h1>
  <p class="intro">Log in to pick up where you left off.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-block" type="submit">Log in</button>
  </form>

  <p class="auth-footer">
    New here? <a href="{% url 'register' %}">Create an account</a>
  </p>
</div>
{% endblock %}
